id: goals
name: 目标
version: 0.1.0
icon: flag
description: 记住为什么，安排今天的一小步，在助理的对话里接着聊
platforms: [any]
permissions: []
schedule: null
provides: [cards, mcp_tools]
mascot: {sticker: aemeath, accent: "#E86A9A"}
config_schema:
  type: object
  additionalProperties: false
  properties:
    daily_limit: {type: integer, minimum: 0, maximum: 10, default: 2}
    goal_limit: {type: integer, minimum: 0, maximum: 1, default: 1}
    quiet_start: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', default: '23:00'}
    quiet_end: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', default: '07:30'}
    busy_week_threshold: {type: integer, minimum: 1, maximum: 50, default: 4}
