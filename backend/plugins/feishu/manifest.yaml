id: feishu
name: 飞书
version: 0.1.0
icon: message
description: 官方 SDK，以用户身份增量读取白名单会话
platforms: [linux, macos, windows]
permissions: [network]
schedule: null
provides: [source, cards]
mascot: {accent: "#22B8CF"}  # no sticker yet: the App shows the placeholder
config_schema:
  type: object
  additionalProperties: false
  properties:
    whitelist:
      type: array
      uniqueItems: true
      items: {type: string, minLength: 1}
      default: []
    initial_lookback_hours: {type: integer, minimum: 1, maximum: 720, default: 24}
    max_pages: {type: integer, minimum: 1, maximum: 100, default: 20}
