[project]
name = "assistant-backend"
version = "0.1.0"
description = "Local-first 24 hour assistant backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "mcp>=1.26,<2",
  "apscheduler>=3.11,<4", "httpx>=0.28,<1", "pydantic-settings>=2.8,<3",
  "pyyaml>=6,<7", "jsonschema>=4.23,<5", "lark-oapi>=1.5,<2", "tzdata>=2025.1",
  "python-dotenv>=1,<2",
  "pywin32>=311; sys_platform == 'win32'",
  "psutil>=7,<8; sys_platform == 'win32'",
  "keyring>=25,<26; sys_platform == 'win32'",
  "pillow>=11,<13; sys_platform == 'win32'",
  "pypdfium2>=4.30,<6; sys_platform == 'win32'",
  "winrt-Windows.Media.Ocr>=3.2,<4; sys_platform == 'win32'",
  "winrt-Windows.Globalization>=3.2,<4; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=3.2,<4; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=3.2,<4; sys_platform == 'win32'",
  "winrt-Windows.Storage>=3.2,<4; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams>=3.2,<4; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging>=3.2,<4; sys_platform == 'win32'",
]

[project.optional-dependencies]
windows-asr = ["faster-whisper>=1.2,<2; sys_platform == 'win32'"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8", "ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
