# XcodeGen spec. The .xcodeproj is generated (`xcodegen generate`) and not committed.
name: Assistant

options:
  bundleIdPrefix: com.example.assistant24h
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    # Free personal team: pick it in Xcode (Signing & Capabilities) and change the prefix
    # below to something unique to you. No paid-only capabilities are used.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    BUNDLE_ID_PREFIX: com.example.assistant24h

packages:
  AssistantCore:
    path: Packages/AssistantCore

targets:
  Assistant-iOS:
    type: application
    platform: iOS
    sources:
      - App/iOS
      # The App icon (Icon Composer, Liquid Glass), from 助理's sticker by scripts/make-app-icon.swift.
      - path: App/AppIcon.icon
        buildPhase: resources
      # Plugin stickers (docs/mascot.md), copied as the folder "stickers".
      - path: Design/stickers
        type: folder
        buildPhase: resources
    dependencies:
      - package: AssistantCore
        products:
          - AssistantCore
          - AssistantUI
      # Embeds the watch app in the iPhone App ("Embed Watch Content", copied to
      # Assistant-iOS.app/Watch/), so installing the iPhone App also installs it on the watch.
      - target: Assistant-watchOS
      - target: Assistant-phoneWidget
      - target: Assistant-share
    info:
      path: Generated/iOS-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Aemeath Bot
        UILaunchScreen: {}
        AssistantAppGroup: group.$(BUNDLE_ID_PREFIX)
        AssistantPrivateKeychainGroup: $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
        AssistantSharedKeychainGroup: $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).share-token
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - $(BUNDLE_ID_PREFIX).ios.refresh
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_ID_PREFIX).phone
            CFBundleURLSchemes:
              - aemeath
        # The backend over Tailscale; tailscale serve gives HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # HealthSync reads these and uploads them to the user's own Mac (docs/api.md).
        NSHealthShareUsageDescription: Aemeath Bot 读取睡眠、心率、HRV、步数和训练记录，只上传到你自己的 Mac mini，用来生成健康简报和准备度。
    entitlements:
      path: Generated/iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX)
        # Keep the old default group first, so the existing private token remains accessible.
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
          - $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).share-token
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # New samples wake the App to upload them (HealthSync's observer queries).
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ios
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme: {}

  Assistant-macOS:
    type: application
    platform: macOS
    sources:
      - App/macOS
      # The App icon (Icon Composer, Liquid Glass), from 助理's sticker by scripts/make-app-icon.swift.
      - path: App/AppIcon.icon
        buildPhase: resources
      # Plugin stickers (docs/mascot.md), copied as the folder "stickers".
      - path: Design/stickers
        type: folder
        buildPhase: resources
    dependencies:
      - package: AssistantCore
        products:
          - AssistantCore
          - AssistantUI
    info:
      path: Generated/macOS-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Aemeath Bot
        LSApplicationCategoryType: public.app-category.productivity
        # The backend on this Mac (127.0.0.1) or over Tailscale; tailscale serve gives HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).mac
    scheme: {}

  # Single-target watch app, the companion of the iPhone App: it gets its data from the iPhone
  # over WatchConnectivity (watchOS has no Tailscale) and never contacts the backend. It ships
  # inside the iPhone App (see Assistant-iOS); its own scheme is for running it on the watch
  # directly while developing.
  Assistant-watchOS:
    type: application
    platform: watchOS
    sources:
      - App/watchOS
      # The complications' views, drawn by the debug gallery in the watch app (-watch.gallery 1).
      - App/watchWidget/ComplicationViews.swift
      # The App icon (Icon Composer, Liquid Glass), from 助理's sticker by scripts/make-app-icon.swift.
      - path: App/AppIcon.icon
        buildPhase: resources
      # Plugin stickers (docs/mascot.md), copied as the folder "stickers".
      - path: Design/stickers
        type: folder
        buildPhase: resources
    dependencies:
      - package: AssistantCore
        products:
          - AssistantCore
          - AssistantUI
      - target: Assistant-watchWidget
    info:
      path: Generated/watchOS-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Aemeath Bot
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).ios
        # Needs the iPhone for its data, so it is installed together with the iPhone App.
        WKRunsIndependentlyOfCompanionApp: false
        # Shared with the complications; see ComplicationData and WatchSnapshot.save.
        AssistantAppGroup: group.$(BUNDLE_ID_PREFIX)
        # Complications open a page of the watch app (WatchPage.url).
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_ID_PREFIX).watch
            CFBundleURLSchemes:
              - aemeath-watch
    entitlements:
      path: Generated/watchOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX)
    settings:
      base:
        # A companion watch app's ID starts with the iPhone App's.
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ios.watch
        # Archived inside the iPhone App, not as a product of its own.
        SKIP_INSTALL: YES
    scheme: {}

  # Watch face complications (此刻, 下一节课, 准备度, 剩余待办), read from the App Group.
  Assistant-watchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - App/watchWidget
    dependencies:
      - package: AssistantCore
        products:
          - AssistantCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Generated/watchWidget-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Aemeath Bot
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AssistantAppGroup: group.$(BUNDLE_ID_PREFIX)
    entitlements:
      path: Generated/watchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ios.watch.widget

  # One extension for both home-screen and lock-screen iPhone widgets. No networking/token.
  Assistant-phoneWidget:
    type: app-extension
    platform: iOS
    sources:
      - App/phoneWidget
    dependencies:
      - package: AssistantCore
        products:
          - AssistantCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Generated/phoneWidget-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: 此刻与待办
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AssistantAppGroup: group.$(BUNDLE_ID_PREFIX)
    entitlements:
      path: Generated/phoneWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ios.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  Assistant-share:
    type: app-extension
    platform: iOS
    sources:
      - App/share
    dependencies:
      - package: AssistantCore
        products:
          - AssistantCore
    info:
      path: Generated/share-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: 转给助理
        AssistantAppGroup: group.$(BUNDLE_ID_PREFIX)
        AssistantSharedKeychainGroup: $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).share-token
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Every attachment must be text or a web URL. Files/images and mixed shares stay out.
            NSExtensionActivationRule: >-
              extensionItems.@count > 0 AND
              SUBQUERY(extensionItems, $item,
                $item.attachments.@count > 0 AND
                SUBQUERY($item.attachments, $attachment,
                  (ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.text" OR
                   ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url") AND
                  NOT (ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.file-url") AND
                  NOT (ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image")
                ).@count == $item.attachments.@count
              ).@count == extensionItems.@count
    entitlements:
      path: Generated/share.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(BUNDLE_ID_PREFIX).share-token
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).ios.share
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
