name: Backend

# Every push and every pull request run the full backend test suite and Ruff on Linux.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + ruff (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # pyproject requires >=3.12; the Mac mini will run whichever of these uv picks.
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          # Same uv as local development; bump together with uv.lock when upgrading.
          version: "0.13.5"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: pytest
        run: uv run pytest -q

  windows:
    name: pytest + ruff (native Windows, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked Windows dependencies
        run: uv sync --locked
      - name: Parse Task Scheduler installer
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/install_windows.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | Write-Error; exit 1 }
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: pytest
        # The suite takes about 14 minutes here against 2 on Linux; list where it goes.
        run: uv run pytest -q --durations=15
